server {
    listen 80;
    listen [::]:80;
    server_name tlhdd.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name tlhdd.cn;

    ssl_certificate /etc/letsencrypt/live/tlhdd.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tlhdd.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 60m;
    client_body_timeout 600s;
    add_header Strict-Transport-Security "max-age=31536000" always;

    root /srv/tlhdd;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types application/json application/javascript text/css image/svg+xml;

    # Only public media/code extensions are served directly; other paths retain
    # the application's static allowlist and authentication checks.
    location ~ "^/uploads/[0-9]{4}/[0-9]{2}/[A-Za-z0-9_-]+\.(?:jpg|jpeg|png|webp|mp4|webm|mov)$" {
        # Python checks the verified-object index, then redirects to CDN or
        # serves the local mirror. Do not bypass it with try_files here.
        proxy_pass http://127.0.0.1:4174;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_cache off;
    }

    location ~ ^/assets/(?:default-media|images)/.+\.(?:jpg|jpeg|png|webp|gif|avif|svg|ico|mp4|webm|mov)$ {
        proxy_pass http://127.0.0.1:4174;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_cache off;
    }

    location ~ ^/admin/(?:js|jse|css)/[A-Za-z0-9_-]+-[A-Za-z0-9_-]+\.(?:js|css)$ {
        try_files $uri =404;
        expires 30d;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location ~ ^/(?:assets|admin)/(?:[A-Za-z0-9_-]+/)*[A-Za-z0-9_-][A-Za-z0-9_.-]*\.(?:js|css)$ {
        try_files $uri =404;
        expires -1;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location ~ ^/(?:assets|admin)/(?:[A-Za-z0-9_-]+/)*[A-Za-z0-9_-][A-Za-z0-9_.-]*\.(?:jpg|jpeg|png|webp|svg|ico|woff|woff2|ttf|eot)$ {
        try_files $uri =404;
        expires 7d;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        proxy_pass http://127.0.0.1:4174;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_request_buffering off;
    }

    access_log /var/log/nginx/tlhdd.cn.access.log;
    error_log /var/log/nginx/tlhdd.cn.error.log;
}
